openapi: 3.1.0
info:
  title: Agilora API
  version: 2.0.0
  description: Contrato HTTP de la plataforma SaaS Agilora.
  license:
    name: Uso autorizado de Agilora
servers:
  - url: https://api.agilora.example/api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Inicio, cierre, renovación y recuperación de sesiones.
  - name: Account
    description: Datos del negocio y preferencias personales del usuario.
  - name: Settings
    description: IGV y reglas comerciales del negocio.
  - name: Users
    description: Membresías, invitaciones y estados de usuarios.
  - name: Catalog
    description: Grupos, atributos, productos, precios y costos adicionales.
  - name: Inventory
    description: Stock, movimientos, ajustes e ingresos.
  - name: Supply
    description: Proveedores y abastecimientos.
  - name: Commercial Operations
    description: Vistas previas, ventas y cancelaciones.
  - name: Dashboard
    description: Indicadores resumidos del negocio.
  - name: Reports
    description: Reportes y auditoría administrativa.
  - name: Health
    description: Estado del proceso y sus dependencias.
paths:
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Sesión iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/csrf:
    get:
      tags: [Authentication]
      security: []
      summary: Obtener token CSRF
      operationId: getCsrf
      responses:
        '200': { description: Token CSRF emitido, content: { application/json: { schema: { $ref: '#/components/schemas/CsrfResponse' } } } }
  /auth/refresh:
    post:
      tags: [Authentication]
      security: [{ refreshCookie: [], csrfToken: [] }]
      summary: Renovar sesión
      operationId: refreshSession
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '200': { description: Access token renovado, content: { application/json: { schema: { $ref: '#/components/schemas/AccessTokenResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Consultar contexto de sesión
      operationId: getCurrentContext
      responses:
        '200': { description: "Usuario, rol y negocio", content: { application/json: { schema: { $ref: '#/components/schemas/SessionContext' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Cerrar sesión
      operationId: logout
      security: [{ bearerAuth: [], refreshCookie: [], csrfToken: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfHeader' }]
      responses:
        '204': { description: Sesión revocada }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/change:
    post:
      tags: [Authentication]
      summary: Cambiar contraseña
      operationId: changePassword
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Contraseña actualizada y sesiones revocadas }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/password/forgot:
    post:
      tags: [Authentication]
      security: []
      summary: Solicitar recuperación de contraseña
      operationId: requestPasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordForgotRequest' }
      responses:
        '202': { description: Respuesta genérica, content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } } }
  /auth/password/reset:
    post:
      tags: [Authentication]
      security: []
      summary: Restablecer contraseña
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204': { description: Contraseña restablecida }
  /account:
    get:
      tags: [Account]
      summary: Consultar datos del negocio
      operationId: getAccount
      description: Solo ADMIN.
      responses:
        '200': { description: Datos del negocio, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessAccount' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Account]
      summary: Actualizar datos del negocio
      operationId: updateAccount
      description: Solo ADMIN. Requiere control optimista de concurrencia.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessAccountUpdate' }
      responses:
        '200': { description: Datos actualizados, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessAccount' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings:
    get:
      tags: [Settings]
      summary: Consultar configuración del negocio
      operationId: getSettings
      responses:
        '200': { description: Configuración vigente, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessSettings' } } } }
    patch:
      tags: [Settings]
      summary: Actualizar configuración del negocio
      operationId: updateSettings
      description: Solo ADMIN. Requiere control optimista de concurrencia.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessSettingsUpdate' }
      responses:
        '200': { description: Configuración actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessSettings' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/preferences:
    get:
      tags: [Account]
      summary: Consultar preferencias visuales
      operationId: getUserPreferences
      responses:
        '200': { description: Preferencias del usuario, content: { application/json: { schema: { $ref: '#/components/schemas/UserPreferences' } } } }
    patch:
      tags: [Account]
      summary: Actualizar preferencias visuales
      operationId: updateUserPreferences
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferencesUpdate' }
      responses:
        '200': { description: Preferencias actualizadas, content: { application/json: { schema: { $ref: '#/components/schemas/UserPreferences' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /users:
    get:
      tags: [Users]
      summary: Listar miembros del negocio
      operationId: listUsers
      description: Solo ADMIN.
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses:
        '200': { description: Miembros, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/invitations:
    post:
      tags: [Users]
      summary: Invitar operador
      operationId: inviteOperator
      description: Solo ADMIN.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationRequest' }
      responses:
        '201': { description: Invitación creada, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/invitations/accept:
    post:
      tags: [Users]
      security: []
      summary: Aceptar invitación
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '204': { description: Membresía activada }
  /users/{userId}/status:
    patch:
      tags: [Users]
      summary: Bloquear o reactivar usuario
      operationId: updateUserStatus
      description: Solo ADMIN.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusRequest' }
      responses:
        '204': { description: Estado actualizado }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /groups:
    get:
      tags: [Catalog]
      summary: Listar grupos
      operationId: listGroups
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Search' }]
      responses:
        '200': { description: Grupos, content: { application/json: { schema: { $ref: '#/components/schemas/GroupPage' } } } }
    post:
      tags: [Catalog]
      summary: Crear grupo
      operationId: createGroup
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '201': { description: Grupo creado, content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } } }
  /attribute-definitions:
    get:
      tags: [Catalog]
      summary: Listar atributos personalizados
      operationId: listAttributeDefinitions
      responses:
        '200': { description: Atributos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttributeDefinition' } } } } }
    post:
      tags: [Catalog]
      summary: Crear atributo personalizado
      operationId: createAttributeDefinition
      description: Solo ADMIN.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttributeDefinitionRequest' }
      responses:
        '201': { description: Atributo creado, content: { application/json: { schema: { $ref: '#/components/schemas/AttributeDefinition' } } } }
  /products:
    get:
      tags: [Catalog]
      summary: Listar y buscar productos
      operationId: listProducts
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Search' }, { $ref: '#/components/parameters/Active' }]
      responses:
        '200': { description: Productos, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
    post:
      tags: [Catalog]
      summary: Crear producto
      operationId: createProduct
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '201': { description: Producto creado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productId}:
    get:
      tags: [Catalog]
      summary: Consultar producto
      operationId: getProduct
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200': { description: Producto, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
    put:
      tags: [Catalog]
      summary: Editar producto
      operationId: updateProduct
      parameters: [{ $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '200': { description: Producto actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productId}/status:
    patch:
      tags: [Catalog]
      summary: Activar o desactivar producto
      operationId: updateProductStatus
      parameters: [{ $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActiveRequest' }
      responses:
        '204': { description: Estado actualizado }
  /products/{productId}/price-rules:
    get:
      tags: [Catalog]
      summary: Consultar reglas de precio
      operationId: listPriceRules
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200': { description: Reglas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PriceRule' } } } } }
    put:
      tags: [Catalog]
      summary: Reemplazar reglas de precio
      operationId: replacePriceRules
      description: Solo ADMIN.
      parameters: [{ $ref: '#/components/parameters/ProductId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PriceRuleRequest' } }
      responses:
        '200': { description: Reglas actualizadas, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PriceRule' } } } } }
  /charge-definitions:
    get:
      tags: [Catalog]
      summary: Listar costos adicionales
      operationId: listChargeDefinitions
      responses:
        '200': { description: Costos, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChargeDefinition' } } } } }
    post:
      tags: [Catalog]
      summary: Crear costo adicional
      operationId: createChargeDefinition
      description: Solo ADMIN.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChargeDefinitionRequest' }
      responses:
        '201': { description: Costo creado, content: { application/json: { schema: { $ref: '#/components/schemas/ChargeDefinition' } } } }
  /charge-definitions/{chargeId}:
    put:
      tags: [Catalog]
      summary: Editar costo adicional
      operationId: updateChargeDefinition
      description: Solo ADMIN. Requiere control optimista de concurrencia.
      parameters:
        - { $ref: '#/components/parameters/ChargeId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChargeDefinitionRequest' }
      responses:
        '200': { description: Costo actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/ChargeDefinition' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /inventory/stock:
    get:
      tags: [Inventory]
      summary: Consultar stock
      operationId: listStock
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Search' }]
      responses:
        '200': { description: Stock, content: { application/json: { schema: { $ref: '#/components/schemas/StockPage' } } } }
  /inventory/receipts:
    post:
      tags: [Inventory]
      summary: Registrar ingreso directo
      operationId: createReceipt
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptRequest' }
      responses:
        '201': { description: Ingreso confirmado, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryMovement' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /inventory/adjustments:
    post:
      tags: [Inventory]
      summary: Ajustar stock
      operationId: createAdjustment
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201': { description: Ajuste confirmado, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryMovement' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /inventory/movements:
    get:
      tags: [Inventory]
      summary: Consultar movimientos
      operationId: listMovements
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { description: Movimientos, content: { application/json: { schema: { $ref: '#/components/schemas/MovementPage' } } } }
  /suppliers:
    get:
      tags: [Supply]
      summary: Listar proveedores
      operationId: listSuppliers
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/Search' }]
      responses:
        '200': { description: Proveedores, content: { application/json: { schema: { $ref: '#/components/schemas/SupplierPage' } } } }
    post:
      tags: [Supply]
      summary: Crear proveedor
      operationId: createSupplier
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierRequest' }
      responses:
        '201': { description: Proveedor creado, content: { application/json: { schema: { $ref: '#/components/schemas/Supplier' } } } }
  /suppliers/{supplierId}/status:
    patch:
      tags: [Supply]
      summary: Activar o desactivar proveedor
      operationId: updateSupplierStatus
      parameters: [{ $ref: '#/components/parameters/SupplierId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActiveRequest' }
      responses:
        '204': { description: Estado actualizado }
  /supplies:
    get:
      tags: [Supply]
      summary: Listar abastecimientos
      operationId: listSupplies
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { description: Abastecimientos, content: { application/json: { schema: { $ref: '#/components/schemas/SupplyPage' } } } }
    post:
      tags: [Supply]
      summary: Confirmar abastecimiento
      operationId: createSupply
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplyRequest' }
      responses:
        '201': { description: Abastecimiento confirmado, content: { application/json: { schema: { $ref: '#/components/schemas/Supply' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /supplies/{supplyId}:
    get:
      tags: [Supply]
      summary: Consultar abastecimiento
      operationId: getSupply
      parameters: [{ $ref: '#/components/parameters/SupplyId' }]
      responses:
        '200': { description: Abastecimiento, content: { application/json: { schema: { $ref: '#/components/schemas/Supply' } } } }
  /commercial-operations/preview:
    post:
      tags: [Commercial Operations]
      summary: Calcular vista previa
      operationId: previewOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '200': { description: Resultado no persistente, content: { application/json: { schema: { $ref: '#/components/schemas/OperationPreview' } } } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /sales:
    get:
      tags: [Commercial Operations]
      summary: Listar ventas
      operationId: listSales
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { description: Ventas, content: { application/json: { schema: { $ref: '#/components/schemas/SalePage' } } } }
    post:
      tags: [Commercial Operations]
      summary: Confirmar venta
      operationId: createSale
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleRequest' }
      responses:
        '201': { description: Venta confirmada, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /sales/{saleId}:
    get:
      tags: [Commercial Operations]
      summary: Consultar venta
      operationId: getSale
      parameters: [{ $ref: '#/components/parameters/SaleId' }]
      responses:
        '200': { description: Venta, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }
  /sales/{saleId}/cancel:
    post:
      tags: [Commercial Operations]
      summary: Cancelar venta
      operationId: cancelSale
      description: Solo ADMIN. Conserva la venta y registra una reversión de inventario.
      parameters: [{ $ref: '#/components/parameters/SaleId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancellationRequest' }
      responses:
        '200': { description: Venta cancelada, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Consultar dashboard
      operationId: getDashboardSummary
      description: Solo ADMIN.
      parameters: [{ $ref: '#/components/parameters/Period' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { description: Resumen, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } } }
  /reports/{reportType}:
    get:
      tags: [Reports]
      summary: Generar reporte
      operationId: getReport
      description: Solo ADMIN. Formatos iniciales JSON y CSV.
      parameters:
        - { name: reportType, in: path, required: true, schema: { type: string, enum: [SALES, INVENTORY, PRODUCTS, SUPPLIES] } }
        - { $ref: '#/components/parameters/Period' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: format, in: query, schema: { type: string, enum: [JSON, CSV], default: JSON } }
      responses:
        '200': { description: Reporte generado }
  /audit-events:
    get:
      tags: [Reports]
      summary: Consultar auditoría
      operationId: listAuditEvents
      description: Solo ADMIN.
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' }]
      responses:
        '200': { description: Eventos, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } } }
  /health/live:
    get:
      tags: [Health]
      security: []
      summary: Estado del proceso
      operationId: getLiveHealth
      responses:
        '200': { description: Proceso activo }
  /health/ready:
    get:
      tags: [Health]
      security: []
      summary: Estado de dependencias
      operationId: getReadyHealth
      responses:
        '200': { description: Dependencias disponibles }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: agilora_refresh }
    csrfToken: { type: apiKey, in: header, name: X-CSRF-TOKEN }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 100 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, minLength: 3, maxLength: 100 } }
    CsrfHeader: { name: X-CSRF-TOKEN, in: header, required: true, schema: { type: string, minLength: 32, maxLength: 512 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 } }
    Active: { name: active, in: query, schema: { type: boolean } }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    Period: { name: period, in: query, schema: { type: string, enum: [TODAY, LAST_7_DAYS, LAST_MONTH, ALL] } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    ProductId: { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
    SupplierId: { name: supplierId, in: path, required: true, schema: { type: string, format: uuid } }
    SupplyId: { name: supplyId, in: path, required: true, schema: { type: string, format: uuid } }
    SaleId: { name: saleId, in: path, required: true, schema: { type: string, format: uuid } }
    ChargeId: { name: chargeId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest: { description: Solicitud inválida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Unauthorized: { description: Sesión ausente o inválida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Forbidden: { description: Operación no autorizada, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    NotFound: { description: Recurso no encontrado, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    Conflict: { description: "Conflicto, stock insuficiente, duplicado o concurrencia", content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    UnprocessableEntity: { description: Regla de negocio inválida, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    TooManyRequests: { description: Rate limit excedido, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
    ServiceUnavailable: { description: Dependencia no disponible, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } } }
  schemas:
    DecimalAmount: { type: string, pattern: '^[0-9]{1,10}([.][0-9]{1,2})?$' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
    LoginResponse:
      type: object
      required: [accessToken, expiresIn, context, csrfToken]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        context: { $ref: '#/components/schemas/SessionContext' }
        csrfToken: { type: string, minLength: 32, maxLength: 512 }
    AccessTokenResponse:
      type: object
      required: [accessToken, expiresIn, csrfToken]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        csrfToken: { type: string, minLength: 32, maxLength: 512 }
    CsrfResponse:
      type: object
      required: [csrfToken]
      properties:
        csrfToken: { type: string, minLength: 32, maxLength: 512 }
    MessageResponse:
      type: object
      required: [message]
      properties: { message: { type: string } }
    SessionContext:
      type: object
      required: [userId, businessId, businessName, email, role, membershipStatus]
      properties:
        userId: { type: string, format: uuid }
        businessId: { type: string, format: uuid }
        businessName: { type: string, maxLength: 150 }
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [ADMIN, OPERATOR] }
        membershipStatus: { type: string, enum: [ACTIVE, BLOCKED, INVITED] }
    BusinessAccount:
      type: object
      required: [businessId, businessName, contactEmail, version]
      properties:
        businessId: { type: string, format: uuid }
        businessName: { type: string, minLength: 1, maxLength: 150 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        version: { type: integer, format: int64 }
    BusinessAccountUpdate:
      type: object
      minProperties: 1
      properties:
        businessName: { type: string, minLength: 1, maxLength: 150 }
        contactEmail: { type: string, format: email, maxLength: 254 }
    BusinessSettings:
      type: object
      required: [igvRate, version]
      properties:
        igvRate: { type: number, minimum: 0, maximum: 1, example: 0.18 }
        version: { type: integer, format: int64 }
    BusinessSettingsUpdate:
      type: object
      minProperties: 1
      properties:
        igvRate: { type: number, minimum: 0, maximum: 1 }
    UserPreferences:
      type: object
      required: [theme, fontSize, version]
      properties:
        theme: { type: string, enum: [LIGHT, DARK] }
        fontSize: { type: string, enum: [SMALL, MEDIUM, LARGE] }
        version: { type: integer, format: int64 }
    UserPreferencesUpdate:
      type: object
      minProperties: 1
      properties:
        theme: { type: string, enum: [LIGHT, DARK] }
        fontSize: { type: string, enum: [SMALL, MEDIUM, LARGE] }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
        newPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
        confirmPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
    PasswordForgotRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email, maxLength: 254 } }
    PasswordResetRequest:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token: { type: string, minLength: 32, maxLength: 512 }
        newPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
        confirmPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
    User:
      type: object
      required: [userId, email, role, status, version]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        role: { type: string, enum: [ADMIN, OPERATOR] }
        status: { type: string, enum: [ACTIVE, BLOCKED, INVITED] }
        version: { type: integer, format: int64 }
    UserPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    InvitationRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email, maxLength: 254 } }
    Invitation:
      type: object
      required: [invitationId, email, role, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [OPERATOR] }
        expiresAt: { type: string, format: date-time }
    AcceptInvitationRequest:
      type: object
      required: [token, password, confirmPassword]
      properties:
        token: { type: string, minLength: 32, maxLength: 512 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
        confirmPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
    UserStatusRequest:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ACTIVE, BLOCKED] } }
    NameRequest:
      type: object
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 100 } }
    Group:
      type: object
      required: [groupId, name, active]
      properties:
        groupId: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        active: { type: boolean }
    GroupPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    AttributeDefinitionRequest:
      type: object
      required: [name, dataType, required]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        dataType: { type: string, enum: [TEXT, NUMBER, BOOLEAN, DATE] }
        required: { type: boolean }
        searchable: { type: boolean, default: false }
    AttributeDefinition:
      allOf:
        - $ref: '#/components/schemas/AttributeDefinitionRequest'
        - type: object
          required: [attributeDefinitionId, active]
          properties:
            attributeDefinitionId: { type: string, format: uuid }
            active: { type: boolean }
    ProductAttribute:
      type: object
      required: [attributeDefinitionId, value]
      properties:
        attributeDefinitionId: { type: string, format: uuid }
        value: { type: [string, number, boolean] }
    ProductRequest:
      type: object
      required: [groupId, name, attributes, priceRules]
      properties:
        groupId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 150 }
        attributes: { type: array, items: { $ref: '#/components/schemas/ProductAttribute' } }
        priceRules: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PriceRuleRequest' } }
        initialStock: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductRequest'
        - type: object
          required: [productId, currentStock, active, version, updatedAt]
          properties:
            productId: { type: string, format: uuid }
            currentStock: { type: integer, minimum: 0 }
            active: { type: boolean }
            version: { type: integer, format: int64 }
            updatedAt: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    PriceRuleRequest:
      type: object
      required: [minimumQuantity, unitPrice]
      properties:
        minimumQuantity: { type: integer, minimum: 1, maximum: 1000000 }
        maximumQuantity: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        unitPrice: { $ref: '#/components/schemas/DecimalAmount' }
    PriceRule:
      allOf:
        - $ref: '#/components/schemas/PriceRuleRequest'
        - type: object
          required: [priceRuleId]
          properties: { priceRuleId: { type: string, format: uuid } }
    ChargeTier:
      type: object
      required: [minimumQuantity, amount]
      properties:
        minimumQuantity: { type: integer, minimum: 1 }
        maximumQuantity: { type: [integer, 'null'], minimum: 1 }
        amount: { $ref: '#/components/schemas/DecimalAmount' }
    ChargeDefinitionRequest:
      type: object
      required: [name, chargeKind, scope, multiplierKind, tiers]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        chargeKind: { type: string, enum: [FIXED, PERCENTAGE] }
        scope: { type: string, enum: [LINE, OPERATION] }
        multiplierKind: { type: string, enum: [NONE, LOTS, COLORS] }
        lotSize: { type: [integer, 'null'], minimum: 1, maximum: 1000000 }
        maxMultiplier: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        tiers: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ChargeTier' } }
    ChargeDefinition:
      allOf:
        - $ref: '#/components/schemas/ChargeDefinitionRequest'
        - type: object
          required: [chargeDefinitionId, active, version]
          properties:
            chargeDefinitionId: { type: string, format: uuid }
            active: { type: boolean }
            version: { type: integer, format: int64 }
    ActiveRequest:
      type: object
      required: [active]
      properties: { active: { type: boolean } }
    ReceiptRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        note: { type: string, maxLength: 255 }
    AdjustmentRequest:
      type: object
      required: [productId, direction, quantity, reason]
      properties:
        productId: { type: string, format: uuid }
        direction: { type: string, enum: [INCREASE, DECREASE] }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        reason: { type: string, minLength: 1, maxLength: 255 }
    SupplierRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        taxId: { type: string, maxLength: 30 }
        phone: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254 }
        address: { type: string, maxLength: 255 }
    Supplier:
      allOf:
        - $ref: '#/components/schemas/SupplierRequest'
        - type: object
          required: [supplierId, active, version]
          properties:
            supplierId: { type: string, format: uuid }
            active: { type: boolean }
            version: { type: integer, format: int64 }
    SupplierPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    SupplyItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
    SupplyRequest:
      type: object
      required: [items]
      properties:
        supplierId: { type: [string, 'null'], format: uuid }
        note: { type: string, maxLength: 255 }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/SupplyItemRequest' } }
    Supply:
      allOf:
        - $ref: '#/components/schemas/SupplyRequest'
        - type: object
          required: [supplyId, status, createdAt]
          properties:
            supplyId: { type: string, format: uuid }
            status: { type: string, enum: [CONFIRMED] }
            createdAt: { type: string, format: date-time }
    SupplyPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Supply' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    DiscountRequest:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [PERCENTAGE, FIXED] }
        value: { $ref: '#/components/schemas/DecimalAmount' }
    OperationChargeRequest:
      type: object
      required: [chargeDefinitionId]
      properties:
        chargeDefinitionId: { type: string, format: uuid }
        multiplier: { type: integer, minimum: 1, maximum: 100 }
    OperationLineRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        charges: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/OperationChargeRequest' } }
    OperationRequest:
      type: object
      required: [items]
      properties:
        description: { type: string, maxLength: 2000 }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/OperationLineRequest' } }
        charges: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/OperationChargeRequest' } }
        discount: { $ref: '#/components/schemas/DiscountRequest' }
    OperationLineResult:
      type: object
      required: [productId, quantity, unitPrice, productAmount, lineAmount]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/DecimalAmount' }
        productAmount: { $ref: '#/components/schemas/DecimalAmount' }
        chargesAmount: { $ref: '#/components/schemas/DecimalAmount' }
        lineAmount: { $ref: '#/components/schemas/DecimalAmount' }
    DiscountResult:
      type: object
      required: [type, value, amount]
      properties:
        type: { type: string, enum: [PERCENTAGE, FIXED] }
        value: { $ref: '#/components/schemas/DecimalAmount' }
        amount: { $ref: '#/components/schemas/DecimalAmount' }
    OperationPreview:
      type: object
      required: [items, subtotal, igvRate, igv, total, currency]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OperationLineResult' } }
        chargesAmount: { $ref: '#/components/schemas/DecimalAmount' }
        discount: { $ref: '#/components/schemas/DiscountResult' }
        subtotal: { $ref: '#/components/schemas/DecimalAmount' }
        igvRate: { type: number, minimum: 0, maximum: 1 }
        igv: { $ref: '#/components/schemas/DecimalAmount' }
        total: { $ref: '#/components/schemas/DecimalAmount' }
        currency: { type: string, enum: [PEN] }
    SaleRequest:
      allOf:
        - $ref: '#/components/schemas/OperationRequest'
    Sale:
      allOf:
        - $ref: '#/components/schemas/OperationPreview'
        - type: object
          required: [saleId, status, createdAt]
          properties:
            saleId: { type: string, format: uuid }
            status: { type: string, enum: [CONFIRMED, CANCELLED] }
            createdAt: { type: string, format: date-time }
            cancelledAt: { type: [string, 'null'], format: date-time }
            cancellationReason: { type: [string, 'null'], maxLength: 255 }
    SalePage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Sale' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    CancellationRequest:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 255 } }
    InventoryMovement:
      type: object
      required: [movementId, productId, movementType, quantityDelta, previousStock, resultingStock, createdAt]
      properties:
        movementId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        movementType: { type: string, enum: [INITIAL_RECEIPT, RECEIPT, SUPPLY_RECEIPT, SALE_OUT, SALE_REVERSAL, ADJUSTMENT] }
        quantityDelta: { type: integer, not: { const: 0 } }
        previousStock: { type: integer, minimum: 0 }
        resultingStock: { type: integer, minimum: 0 }
        reason: { type: [string, 'null'], maxLength: 255 }
        createdAt: { type: string, format: date-time }
    StockPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    MovementPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InventoryMovement' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    DashboardSummary:
      type: object
      required: [period, activeProducts, lowStockProducts, outOfStockProducts, recentSales, recentMovements]
      properties:
        period: { type: string }
        activeProducts: { type: integer, minimum: 0 }
        lowStockProducts: { type: integer, minimum: 0 }
        outOfStockProducts: { type: integer, minimum: 0 }
        salesAmount: { $ref: '#/components/schemas/DecimalAmount' }
        salesCount: { type: integer, minimum: 0 }
        recentSales: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/Sale' } }
        recentMovements: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/InventoryMovement' } }
    AuditEvent:
      type: object
      required: [auditEventId, action, entityType, occurredAt, outcome, traceId]
      properties:
        auditEventId: { type: string, format: uuid }
        actorUserId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        outcome: { type: string, enum: [SUCCESS, FAILURE] }
        traceId: { type: string }
    AuditEventPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    ProblemDetails:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        traceId: { type: string }
