openapi: 3.1.0
info:
  title: PackFlow API
  version: 1.0.0
  description: Contrato HTTP de PackFlow.
  license:
    name: Uso privado de PackFlow
    url: https://github.com/angelfdevs/packflow-app
servers:
  - url: https://api.packflow.example/api/v1
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Autenticación, sesiones y recuperación de contraseña.
  - name: Account
    description: Cuenta y configuración del negocio.
  - name: Catalog
    description: Categorías, materiales y productos.
  - name: Inventory
    description: Stock, ingresos, ajustes y movimientos.
  - name: Quotes
    description: Simulaciones temporales de cotizaciones.
  - name: Sales
    description: Ventas confirmadas.
  - name: Dashboard
    description: Resumen operativo del negocio.
  - name: Health
    description: Estado del servicio y dependencias.
paths:
  /auth/login:
    post:
      summary: POST /auth/login
      operationId: postauthLogin1
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión iniciada. El servidor establece las cookies pf_refresh y XSRF-TOKEN.
          headers:
            Set-Cookie:
              description: Cookies HttpOnly de refresh y token CSRF no sensible.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/csrf:
    get:
      summary: GET /auth/csrf
      operationId: getauthCsrf2
      tags: [Authentication]
      security: []
      description: Genera o recupera un token CSRF no sensible para que el frontend lo envíe en el encabezado X-CSRF-TOKEN. El token solo se conserva en memoria del frontend y la cookie XSRF-TOKEN no es una credencial.
      responses:
        '200':
          description: Token CSRF emitido. El servidor establece o renueva la cookie XSRF-TOKEN.
          headers:
            Set-Cookie:
              description: Cookie XSRF-TOKEN no sensible.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfTokenResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/refresh:
    post:
      summary: POST /auth/refresh
      operationId: postauthRefresh2
      tags: [Authentication]
      security:
        - refreshCookie: []
          csrfToken: []
      description: No existe expiración por inactividad ni por tiempo absoluto. El refresh token rota, está asociado a una sesión mediante session_id y puede revocarse.
      responses:
        '200':
          description: Access token renovado. El servidor rota pf_refresh, establece XSRF-TOKEN y devuelve el nuevo token CSRF no sensible.
          headers:
            Set-Cookie:
              description: Cookies rotadas de refresh y token CSRF no sensible.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/me:
    get:
      summary: GET /auth/me
      operationId: getauthMe3
      tags: [Authentication]
      responses:
        '200': { description: Cuenta autenticada, content: { application/json: { schema: { $ref: '#/components/schemas/AccountIdentity' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      summary: POST /auth/logout
      operationId: postauthLogout4
      tags: [Authentication]
      security:
        - bearerAuth: []
          refreshCookie: []
          csrfToken: []
      responses:
        '204': { description: Sesión revocada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/change:
    post:
      summary: POST /auth/password/change
      operationId: postauthPasswordChange5
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Contraseña actualizada y sesiones revocadas }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/forgot:
    post:
      summary: POST /auth/password/forgot
      operationId: postauthPasswordForgot6
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordForgotRequest' }
      responses:
        '202':
          description: Respuesta genérica para evitar enumeración de cuentas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordRecoveryAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/password/reset:
    post:
      summary: POST /auth/password/reset
      operationId: postauthPasswordReset7
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204': { description: Contraseña restablecida y sesiones revocadas }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /account:
    get:
      summary: GET /account
      operationId: getaccount8
      tags: [Account]
      responses:
        '200': { description: Datos del negocio, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      summary: PATCH /account
      operationId: patchaccount9
      tags: [Account]
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountPatchRequest' }
      responses:
        '200': { description: Cuenta actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /settings:
    get:
      summary: GET /settings
      operationId: getsettings10
      tags: [Account]
      responses:
        '200': { description: Configuración, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    patch:
      summary: PATCH /settings
      operationId: patchsettings11
      tags: [Account]
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatchRequest' }
      responses:
        '200': { description: Configuración actualizada, content: { application/json: { schema: { $ref: '#/components/schemas/Settings' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /categories:
    get:
      summary: GET /categories
      operationId: getcategories12
      tags: [Catalog]
      responses:
        '200': { description: Categorías, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      summary: POST /categories
      operationId: postcategories13
      tags: [Catalog]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '201': { description: Categoría creada, content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /materials:
    get:
      summary: GET /materials
      operationId: getmaterials14
      tags: [Catalog]
      responses:
        '200': { description: Materiales, content: { application/json: { schema: { $ref: '#/components/schemas/MaterialPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      summary: POST /materials
      operationId: postmaterials15
      tags: [Catalog]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameRequest' }
      responses:
        '201': { description: Material creado, content: { application/json: { schema: { $ref: '#/components/schemas/Material' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /products:
    get:
      summary: GET /products
      operationId: getproducts16
      tags: [Catalog]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/CategoryId' }
        - { $ref: '#/components/parameters/MaterialId' }
        - { $ref: '#/components/parameters/Active' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Productos, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      summary: POST /products
      operationId: postproducts17
      tags: [Catalog]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
      responses:
        '201': { description: Producto creado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /products/{productId}:
    parameters: [{ $ref: '#/components/parameters/ProductId' }]
    get:
      summary: GET /products/{productId}
      operationId: getproductsProductId18
      tags: [Catalog]
      responses:
        '200': { description: Producto, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    put:
      summary: PUT /products/{productId}
      operationId: putproductsProductId19
      tags: [Catalog]
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
      responses:
        '200': { description: Producto actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /products/{productId}/status:
    parameters: [{ $ref: '#/components/parameters/ProductId' }]
    patch:
      summary: PATCH /products/{productId}/status
      operationId: patchproductsProductIdStatus20
      tags: [Catalog]
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        '200': { description: Estado actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /inventory/stock:
    get:
      summary: GET /inventory/stock
      operationId: getinventoryStock21
      tags: [Inventory]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/CategoryId' }
        - { $ref: '#/components/parameters/MaterialId' }
        - { $ref: '#/components/parameters/Active' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Stock, content: { application/json: { schema: { $ref: '#/components/schemas/StockPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /inventory/receipts:
    post:
      summary: POST /inventory/receipts
      operationId: postinventoryReceipts22
      tags: [Inventory]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockReceiptRequest' }
      responses:
        '201': { description: Ingreso registrado, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovementResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /inventory/adjustments:
    post:
      summary: POST /inventory/adjustments
      operationId: postinventoryAdjustments23
      tags: [Inventory]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockAdjustmentRequest' }
      responses:
        '201': { description: Ajuste registrado, content: { application/json: { schema: { $ref: '#/components/schemas/StockMovementResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /inventory/movements:
    get:
      summary: GET /inventory/movements
      operationId: getinventoryMovements24
      tags: [Inventory]
      parameters:
        - { $ref: '#/components/parameters/MovementProductId' }
        - { $ref: '#/components/parameters/MovementType' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Movimientos, content: { application/json: { schema: { $ref: '#/components/schemas/MovementPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /quotes/preview:
    post:
      summary: POST /quotes/preview
      operationId: postquotesPreview25
      tags: [Quotes]
      description: No guarda la cotización ni modifica el stock. El backend calcula todos los valores.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '200': { description: Resultado calculado, content: { application/json: { schema: { $ref: '#/components/schemas/OperationResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /sales:
    get:
      summary: GET /sales
      operationId: getsales26
      tags: [Sales]
      parameters:
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: Ventas, content: { application/json: { schema: { $ref: '#/components/schemas/SalePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      summary: POST /sales
      operationId: postsales27
      tags: [Sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperationRequest' }
      responses:
        '201': { description: Venta confirmada, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /sales/{saleId}:
    parameters:
      - name: saleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: GET /sales/{saleId}
      operationId: getsalesSaleId28
      tags: [Sales]
      responses:
        '200': { description: Venta confirmada, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /dashboard/summary:
    get:
      summary: GET /dashboard/summary
      operationId: getdashboardSummary29
      tags: [Dashboard]
      responses:
        '200': { description: Indicadores del negocio, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /health/live:
    get:
      summary: GET /health/live
      operationId: gethealthLive30
      tags: [Health]
      security: []
      responses:
        '200': { description: Proceso disponible }
  /health/ready:
    get:
      summary: GET /health/ready
      operationId: gethealthReady31
      tags: [Health]
      security: []
      responses:
        '200': { description: Backend y PostgreSQL disponibles }
        '503':
          description: Dependencia no disponible
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: pf_refresh }
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Debe coincidir con el valor no sensible de la cookie XSRF-TOKEN.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la versión actual del recurso, por ejemplo `"v12"`.
      schema: { type: string, minLength: 3, maxLength: 100 }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MovementProductId:
      name: productId
      in: query
      schema: { type: string, format: uuid }
    MovementType:
      name: movementType
      in: query
      schema: { type: string, enum: [INITIAL_RECEIPT, RECEIPT, SALE_OUT, LOSS, DAMAGE, CORRECTION] }
    FromDate:
      name: from
      in: query
      schema: { type: string, format: date-time }
    ToDate:
      name: to
      in: query
      schema: { type: string, format: date-time }
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 } }
    CategoryId: { name: categoryId, in: query, schema: { type: string, format: uuid } }
    MaterialId: { name: materialId, in: query, schema: { type: string, format: uuid } }
    Active: { name: active, in: query, schema: { type: boolean } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Autenticación ausente o inválida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Operación no autorizada o CSRF inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Recurso no encontrado
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Conflicto, duplicado, concurrencia o stock insuficiente
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    UnprocessableEntity:
      description: Regla de negocio inválida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    TooManyRequests:
      description: Límite de solicitudes excedido
      headers:
        Retry-After:
          description: Segundos mínimos antes de reintentar.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
    LoginResponse:
      type: object
      required: [accessToken, expiresIn, account, csrfToken]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        account: { $ref: '#/components/schemas/AccountIdentity' }
        csrfToken: { type: string, minLength: 32, maxLength: 512 }
    AccessTokenResponse:
      type: object
      required: [accessToken, expiresIn, csrfToken]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        csrfToken: { type: string, minLength: 32, maxLength: 512 }
    CsrfTokenResponse:
      type: object
      required: [csrfToken]
      properties:
        csrfToken: { type: string, minLength: 32, maxLength: 512 }
    AccountIdentity:
      type: object
      required: [businessAccountId, businessName, email]
      properties:
        businessAccountId: { type: string, format: uuid }
        businessName: { type: string, maxLength: 150 }
        email: { type: string, format: email, maxLength: 254 }
    Account:
      allOf:
        - $ref: '#/components/schemas/AccountIdentity'
        - type: object
          required: [accountStatus, version, updatedAt]
          properties:
            accountStatus: { type: string, enum: [ACTIVE, SUSPENDED, DISABLED] }
            version: { type: integer, format: int64, minimum: 1 }
            updatedAt: { type: string, format: date-time }
    AccountPatchRequest:
      type: object
      minProperties: 1
      properties:
        businessName: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 254 }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
        newPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
        confirmPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
    PasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    PasswordRecoveryAccepted:
      type: object
      required: [message]
      properties:
        message: { type: string, example: "Si el correo está registrado, recibirás instrucciones para recuperar tu contraseña." }
    PasswordResetRequest:
      type: object
      required: [token, newPassword, confirmPassword]
      properties:
        token: { type: string, minLength: 32, maxLength: 512 }
        newPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
        confirmPassword: { type: string, format: password, minLength: 12, maxLength: 128 }
    NameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    Category:
      type: object
      required: [categoryId, name]
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
    CategoryPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Category' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    Material:
      type: object
      required: [materialId, name]
      properties:
        materialId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
    MaterialPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Material' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    Dimensions:
      type: object
      required: [lengthCm, widthCm, heightCm]
      properties:
        lengthCm: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        widthCm: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        heightCm: { type: number, exclusiveMinimum: 0, maximum: 1000 }
    DecimalAmount:
      type: string
      pattern: '^[0-9]{1,10}([.][0-9]{1,2})?$'
    ProductCreateRequest:
      type: object
      required: [categoryId, materialId, name, dimensions, retailPrice, wholesalePrice]
      properties:
        categoryId: { type: string, format: uuid }
        materialId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 150 }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        retailPrice: { $ref: '#/components/schemas/DecimalAmount' }
        wholesalePrice: { $ref: '#/components/schemas/DecimalAmount' }
        initialStock: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
    ProductUpdateRequest:
      type: object
      required: [categoryId, materialId, name, dimensions, retailPrice, wholesalePrice]
      properties:
        categoryId: { type: string, format: uuid }
        materialId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 150 }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        retailPrice: { $ref: '#/components/schemas/DecimalAmount' }
        wholesalePrice: { $ref: '#/components/schemas/DecimalAmount' }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductUpdateRequest'
        - type: object
          required: [productId, currentStock, active, version, updatedAt]
          properties:
            productId: { type: string, format: uuid }
            currentStock: { type: integer, minimum: 0 }
            active: { type: boolean }
            version: { type: integer, format: int64, minimum: 1 }
            updatedAt: { type: string, format: date-time }
    SerigraphyTier:
      type: object
      required: [from, ratePerColor]
      properties:
        from: { type: integer, minimum: 20 }
        to: { type: [integer, 'null'], minimum: 20 }
        ratePerColor: { $ref: '#/components/schemas/DecimalAmount' }
      description: Rango de cantidad y tarifa por color y lote de 100 unidades.
    Settings:
      type: object
      required: [igvRate, minimumScreenPrintingQuantity, screenPrintingTiers, theme, fontSize, version]
      properties:
        igvRate: { type: number, minimum: 0, maximum: 1, example: 0.18 }
        minimumScreenPrintingQuantity: { type: integer, minimum: 20, maximum: 20, default: 20, readOnly: true }
        screenPrintingTiers:
          type: array
          minItems: 3
          maxItems: 3
          items:
              $ref: '#/components/schemas/SerigraphyTier'
        theme: { type: string, enum: [LIGHT, DARK] }
        fontSize: { type: string, enum: [SMALL, MEDIUM, LARGE] }
        version: { type: integer, format: int64, minimum: 1 }
    SettingsPatchRequest:
      type: object
      minProperties: 1
      properties:
        igvRate: { type: number, minimum: 0, maximum: 1 }
        screenPrintingTiers: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/SerigraphyTier' } }
        theme: { type: string, enum: [LIGHT, DARK] }
        fontSize: { type: string, enum: [SMALL, MEDIUM, LARGE] }
    StockReceiptRequest:
      type: object
      required: [productId, quantity, reason]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        reason: { type: string, minLength: 1, maxLength: 255 }
    StockAdjustmentRequest:
      type: object
      required: [productId, adjustmentType, direction, quantity, reason]
      properties:
        productId: { type: string, format: uuid }
        adjustmentType: { type: string, enum: [LOSS, DAMAGE, CORRECTION] }
        direction: { type: string, enum: [INCREASE, DECREASE] }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        reason: { type: string, minLength: 1, maxLength: 255 }
    DiscountRequest:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [PERCENTAGE, FIXED] }
        value: { $ref: '#/components/schemas/DecimalAmount' }
    OperationLineRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
        screenPrinting:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean }
            colors:
              type: integer
              minimum: 0
              maximum: 10
              default: 0
              description: Debe ser cero cuando la serigrafía está deshabilitada y positivo cuando está habilitada.
      description: Cada producto debe aparecer una sola vez dentro de la operación.
    OperationRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/OperationLineRequest' }
        discount: { $ref: '#/components/schemas/DiscountRequest' }
      description: El backend debe rechazar productId repetidos y recalcular todos los importes.
    OperationLineResult:
      type: object
      required: [productId, quantity, unitPrice, priceType, productAmount, lineAmount]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/DecimalAmount' }
        priceType: { type: string, enum: [RETAIL, WHOLESALE] }
        productAmount: { $ref: '#/components/schemas/DecimalAmount', description: 'Importe de las unidades de la línea, sin serigrafía.' }
        screenPrinting:
          type: object
          required: [enabled, colors, lots, ratePerColor, amount]
          properties:
            enabled: { type: boolean }
            colors: { type: integer, minimum: 0 }
            lots: { type: integer, minimum: 0 }
            ratePerColor: { $ref: '#/components/schemas/DecimalAmount' }
            amount: { $ref: '#/components/schemas/DecimalAmount' }
        lineAmount: { $ref: '#/components/schemas/DecimalAmount', description: 'Importe de la línea, incluyendo serigrafía cuando corresponda.' }
    DiscountResult:
      type: object
      description: Tipo, valor y monto real del descuento aplicado a la operación.
      required: [type, value, amount]
      properties:
        type: { type: string, enum: [PERCENTAGE, FIXED] }
        value: { $ref: '#/components/schemas/DecimalAmount' }
        amount: { $ref: '#/components/schemas/DecimalAmount' }
    OperationResult:
      type: object
      description: Resultado con un único subtotal después del descuento, IGV y total.
      required: [items, subtotal, igvRate, igv, total, currency]
      properties:
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OperationLineResult' } }
        discount: { $ref: '#/components/schemas/DiscountResult' }
        subtotal: { $ref: '#/components/schemas/DecimalAmount', description: 'Único subtotal de la operación, después de aplicar el descuento cuando exista.' }
        igvRate: { type: number, minimum: 0, maximum: 1 }
        igv: { $ref: '#/components/schemas/DecimalAmount' }
        total: { $ref: '#/components/schemas/DecimalAmount' }
        currency: { type: string, enum: [PEN] }
    Sale:
      allOf:
        - $ref: '#/components/schemas/OperationResult'
        - type: object
          required: [saleId, status, createdAt]
          properties:
            saleId: { type: string, format: uuid }
            status: { type: string, enum: [CONFIRMED] }
            createdAt: { type: string, format: date-time }
    StockMovementResult:
      type: object
      required: [movementId, productId, movementType, quantityDelta, previousStock, resultingStock, createdAt]
      properties:
        movementId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        movementType: { type: string, enum: [INITIAL_RECEIPT, RECEIPT, SALE_OUT, LOSS, DAMAGE, CORRECTION] }
        quantityDelta: { type: integer, description: Diferencia aplicada al stock; las salidas utilizan valores negativos. }
        previousStock: { type: integer, minimum: 0 }
        resultingStock: { type: integer, minimum: 0 }
        reason: { type: string, maxLength: 255 }
        createdAt: { type: string, format: date-time }
    StockItem:
      type: object
      required: [productId, name, dimensions, currentStock, active]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        categoryId: { type: string, format: uuid }
        materialId: { type: string, format: uuid }
        categoryName: { type: string, maxLength: 100 }
        materialName: { type: string, maxLength: 100 }
        dimensions: { $ref: '#/components/schemas/Dimensions' }
        currentStock: { type: integer, minimum: 0 }
        active: { type: boolean }
    StockPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StockItem' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    InventoryMovement:
      allOf:
        - $ref: '#/components/schemas/StockMovementResult'
        - type: object
          properties:
            saleId: { type: string, format: uuid }
    MovementPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InventoryMovement' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    ProductPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    SalePage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Sale' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    DashboardSummary:
      type: object
      required: [activeProducts, lowStockProducts, lowStockThreshold, lowStockItems, recentSales, recentMovements]
      properties:
        activeProducts: { type: integer, minimum: 0 }
        lowStockProducts: { type: integer, minimum: 0 }
        lowStockThreshold: { type: integer, minimum: 0, example: 15 }
        lowStockItems:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/DashboardStockItem' }
        recentSales:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/DashboardRecentSale' }
        recentMovements:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/DashboardRecentMovement' }
    DashboardStockItem:
      type: object
      required: [productId, name, currentStock]
      properties:
        productId: { type: string, format: uuid }
        name: { type: string, maxLength: 150 }
        currentStock: { type: integer, minimum: 0 }
    DashboardRecentSale:
      type: object
      required: [saleId, total, createdAt]
      properties:
        saleId: { type: string, format: uuid }
        total: { $ref: '#/components/schemas/DecimalAmount' }
        createdAt: { type: string, format: date-time }
    DashboardRecentMovement:
      type: object
      required: [movementId, productId, movementType, quantityDelta, createdAt]
      properties:
        movementId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        movementType: { type: string, enum: [INITIAL_RECEIPT, RECEIPT, SALE_OUT, LOSS, DAMAGE, CORRECTION] }
        quantityDelta: { type: integer, not: { const: 0 } }
        createdAt: { type: string, format: date-time }
    ProblemDetails:
      type: object
      required: [type, title, status, errorCode, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errorCode: { type: string }
        traceId: { type: string }
